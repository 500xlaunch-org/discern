<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Discern: decide what an AI agent may do for you, before it does it." />
  <title>Discern</title>
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Discern" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="cinema.css" />
</head>
<body>
  <div id="root"></div>
  <!-- Capacitor's own runtime. The native bridge alone does not expose plugins
       to the page: core's registerPlugin is what makes them callable, and
       without it the app silently saw no Firebase, no status bar, no app state.
       Copied from @capacitor/core/dist (MIT); refresh it when core is upgraded. -->
  <script src="capacitor.js"></script>
  <script>
    // Every native plugin the app uses, registered once, here.
    window.Native = (function () {
      var C = window.Capacitor;
      if (!C || !C.isNativePlatform || !C.isNativePlatform() || !C.registerPlugin) return {};
      var r = function (n) { try { return C.registerPlugin(n); } catch (e) { return null; } };
      return { SafeArea: r("SafeArea"), StatusBar: r("StatusBar"), App: r("App"), FirebaseMessaging: r("FirebaseMessaging"), Browser: r("Browser"),
        Filesystem: r("Filesystem"), Share: r("Share") };
    })();
    // The plugin publishes the real window insets as CSS variables. It only
    // exists in the native shell; on the web env() already tells the truth.
    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const SafeArea = window.Native.SafeArea;
        if (SafeArea) await SafeArea.enable({ config: {
          customColorsForSystemBars: true,
          statusBarColor: "#00000000", statusBarContent: "light",
          navigationBarColor: "#00000000", navigationBarContent: "light",
        }});
      } catch {}
    });
  </script>
  <script src="i18n.js"></script>
  <script src="phone.js"></script>
  <script src="marks.js"></script>
  <script src="net.js"></script>
  <script src="vault.js"></script>
  <script src="app.js"></script>
</body>
</html>

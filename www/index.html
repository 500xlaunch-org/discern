<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3B6EA3" />
  <meta name="description" content="Discern: decide what an AI agent may do for you, before it does it." />
  <title>Discern</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Discern" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Fraunces:ital,wght@0,500;0,600;1,500&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>
  <script>
    // The plugin publishes the real window insets as CSS variables. It only
    // exists in the native shell; on the web env() already tells the truth.
    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const SafeArea = window.Capacitor?.Plugins?.SafeArea;
        if (SafeArea) await SafeArea.enable({ config: {
          customColorsForSystemBars: true,
          statusBarColor: "#00000000", statusBarContent: "light",
          navigationBarColor: "#00000000", navigationBarContent: "light",
        }});
      } catch {}
    });
  </script>
  <script src="i18n.js"></script>
  <script src="phone.js"></script>
  <script src="marks.js"></script>
  <script src="net.js"></script>
  <script src="app.js"></script>
</body>
</html>

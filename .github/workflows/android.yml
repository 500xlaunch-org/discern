name: Android

# Builds the signed App Bundle and, when asked, publishes it to Play.
#
# The build needs JDK 21 and Android SDK 35, which the Ubuntu runner already
# carries, so nothing has to be installed on anyone's laptop.
#
# Secrets required to build:
#   ANDROID_KEYSTORE_B64     base64 of the upload keystore
#   ANDROID_KEYSTORE_PASS    keystore password
#   ANDROID_KEY_ALIAS        key alias
#   ANDROID_KEY_PASS         key password
# To publish, either (preferred, keyless):
#   vars.GCP_WIF_PROVIDER    projects/N/locations/global/workloadIdentityPools/P/providers/R
#   vars.GCP_PLAY_SA         the service account with Play release permission
# or, if your org allows downloadable keys:
#   secrets.PLAY_SERVICE_ACCOUNT   a service account key JSON
#
# The keyless route needs no stored secret at all: GitHub mints a short lived
# OIDC token, GCP trades it for an access token for the service account. See
# play/README.md for the one time setup.
#
# Without the publish secret the workflow still builds and uploads the AAB as an
# artifact, which is enough to sideload or to upload by hand.

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      publish:
        description: Publish to Play (otherwise build only)
        type: boolean
        default: false
      release_notes:
        description: Release notes
        type: string
        default: First release.
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write        # lets the runner mint an OIDC token for GCP federation

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci

      - name: Client tests
        run: npm test

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3

      - name: Sync the web app into the native shell
        run: npx cap sync android

      - name: Version from the tag, or from the run number
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          else
            NAME="0.1.${GITHUB_RUN_NUMBER}"
          fi
          # versionCode must never be reused and must only increase
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$NAME\"/" android/app/build.gradle

      - name: Decode the upload keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::ANDROID_KEYSTORE_B64 is not set"; exit 1; fi
          echo "$KS" | base64 -d > android/upload.p12

      - name: Build the App Bundle
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          # the keystore is PKCS12, which is Java's default type on JDK 9 and
          # later; the explicit store.type is belt and braces
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/upload.p12 \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.store.type=PKCS12 \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Validate the store listing
        run: |
          python3 -m pip install --quiet pillow
          python3 play/publish.py --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: xurface-discern-${{ steps.ver.outputs.name }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      # Keyless: GitHub mints an OIDC token, GCP trades it for an access token.
      # Nothing is stored, so nothing can leak.
      - name: Authenticate to Google (keyless)
        id: gcpauth
        if: ${{ vars.GCP_WIF_PROVIDER != '' && (inputs.publish || startsWith(github.ref, 'refs/tags/v')) }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_SA }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Publish to Play
        if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/v') }}
        env:
          TOKEN: ${{ steps.gcpauth.outputs.access_token }}
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$TOKEN" ] && [ -z "$SA" ]; then
            echo "::warning::No Play credential configured. The signed bundle is attached to this run; upload it by hand, or see play/README.md to set up keyless publishing."
            exit 0
          fi
          python3 -m pip install --quiet google-api-python-client google-auth pillow
          ARGS=(--aab android/app/build/outputs/bundle/release/app-release.aab
                --track "${{ inputs.track || 'internal' }}"
                --release-name "${{ steps.ver.outputs.name }}"
                --release-notes "${{ inputs.release_notes || 'Release ' }}${{ steps.ver.outputs.name }}")
          if [ -n "$TOKEN" ]; then
            PLAY_ACCESS_TOKEN="$TOKEN" python3 play/publish.py "${ARGS[@]}"
          else
            printf '%s' "$SA" > /tmp/play.json
            python3 play/publish.py "${ARGS[@]}" --creds /tmp/play.json
            rm -f /tmp/play.json
          fi

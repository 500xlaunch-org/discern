name: Android

# Two lanes.
#
#   check    every push and pull request: builds a debug APK. Fast feedback that
#            the native shell still compiles, and an artifact you can sideload
#            without Play or a signing key.
#   release  any Run workflow, or a v* tag: builds the SIGNED App Bundle. It is
#            only uploaded to Play when Publish is on, or when a tag triggered
#            it, so signing can be exercised without committing to a release.
#
# The Ubuntu runner already carries JDK 21 and the Android SDK, so neither lane
# installs a toolchain. android-actions/setup-android is deliberately absent: it
# failed on this runner with "sdkmanager exit code 1" while re-accepting
# licenses the image had already accepted, which broke every build for a week.
#
# Secrets, for the release lane only:
#   ANDROID_KEYSTORE_B64 / _PASS, ANDROID_KEY_ALIAS / _PASS   upload key
# Publishing, keyless (preferred):
#   vars.GCP_WIF_PROVIDER, vars.GCP_PLAY_SA
# or secrets.PLAY_SERVICE_ACCOUNT for a downloadable key.
#
# With no publishing credential the release lane still builds and attaches the
# bundle, so a missing secret never blocks a build.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      publish:
        description: Publish to Play (otherwise build only)
        type: boolean
        default: false
      release_notes:
        description: Release notes
        type: string
        default: First release.

# Google Play requires new apps and updates to target this API level (Android
# 16, required since 2026-08-31). Capacitor 7 generates 35, and variables.gradle
# is regenerated by cap add, so it is set here rather than committed. Google
# raises this every August; bump it when they do.
env:
  ANDROID_TARGET_SDK: "36"

permissions:
  contents: read
  id-token: write        # lets the runner mint an OIDC token for GCP federation

# a release pushes the listing as well, and Play allows one open edit per app
concurrency:
  group: play-edit-com.xurface.discern.app
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- check ---
  check:
    if: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Client tests
        run: npm test
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      # android/ is generated, not committed, so it is created here and then
      # re-branded: cap add ships Capacitor's default icons and splash
      - name: Generate the native project
        run: npx cap add android || npx cap sync android

      - name: Apply the Xurface icons and splash
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/brand.py --only android

      - name: Target the API level Play requires
        run: |
          sed -i -E "s/(compileSdkVersion|targetSdkVersion) = [0-9]+/\1 = ${ANDROID_TARGET_SDK}/" \
            android/variables.gradle
          grep -E "compileSdkVersion|targetSdkVersion|minSdkVersion" android/variables.gradle

      - name: Validate the store listing
        run: |
          python3 -m pip install --quiet pillow
          python3 play/publish.py --dry-run

      - name: Build the debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: discern-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # -------------------------------------------------------------- release ---
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Client tests
        run: npm test
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      # android/ is generated, not committed, so it is created here and then
      # re-branded: cap add ships Capacitor's default icons and splash
      - name: Generate the native project
        run: npx cap add android || npx cap sync android

      - name: Apply the Xurface icons and splash
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/brand.py --only android

      - name: Target the API level Play requires
        run: |
          sed -i -E "s/(compileSdkVersion|targetSdkVersion) = [0-9]+/\1 = ${ANDROID_TARGET_SDK}/" \
            android/variables.gradle
          grep -E "compileSdkVersion|targetSdkVersion|minSdkVersion" android/variables.gradle

      - name: Version from the tag, or from the run number
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          else
            NAME="0.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # versionCode must only ever increase and is never reused
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$NAME\"/" android/app/build.gradle

      - name: Decode the upload keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::ANDROID_KEYSTORE_B64 is not set"; exit 1; fi
          echo "$KS" | base64 -d > android/upload.p12

      - name: Build the App Bundle
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          # the keystore is PKCS12, Java's default type on JDK 9 and later; the
          # explicit store.type is belt and braces
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/upload.p12 \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.store.type=PKCS12 \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Validate the store listing
        run: |
          python3 -m pip install --quiet pillow
          python3 play/publish.py --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: discern-${{ steps.ver.outputs.name }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Authenticate to Google (keyless)
        id: gcpauth
        if: ${{ (inputs.publish || startsWith(github.ref, 'refs/tags/v')) && vars.GCP_WIF_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_SA }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Publish to Play
        if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/v') }}
        env:
          TOKEN: ${{ steps.gcpauth.outputs.access_token }}
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$TOKEN" ] && [ -z "$SA" ]; then
            echo "::warning::No Play credential configured. The signed bundle is attached to this run; upload it by hand, or see play/README.md."
            exit 0
          fi
          python3 -m pip install --quiet google-api-python-client google-auth pillow
          ARGS=(--aab android/app/build/outputs/bundle/release/app-release.aab
                --track "${{ inputs.track || 'internal' }}"
                --release-name "${{ steps.ver.outputs.name }}"
                --release-notes "${{ inputs.release_notes || 'Release ' }}${{ steps.ver.outputs.name }}")
          if [ -n "$TOKEN" ]; then
            PLAY_ACCESS_TOKEN="$TOKEN" python3 play/publish.py "${ARGS[@]}"
          else
            printf '%s' "$SA" > /tmp/play.json
            python3 play/publish.py "${ARGS[@]}" --creds /tmp/play.json
            rm -f /tmp/play.json
          fi

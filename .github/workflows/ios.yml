name: iOS

# Builds Discern for iPhone on a Mac runner and uploads it to App Store
# Connect, where it appears in TestFlight once Apple has processed it.
#
# Why a runner: Apple only accepts builds made with the newest SDK (iOS 26,
# Xcode 26 and later), and the runner image carries it whatever the Mac in the
# office runs. The repository is public, so the macOS minutes cost nothing.
#
# The same tools/ios-release.sh as on a Mac; see tools/ios-signing.md for what
# the secrets are and how they were made:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_B64     App Store Connect API key
#   APPLE_TEAM_ID
#   IOS_DIST_P12_B64, IOS_DIST_P12_PASS           Apple Distribution identity
#   IOS_PROFILE_B64                               "Discern App Store" profile
#   IOS_NSE_PROFILE_B64                           its notification service's profile
#   GOOGLE_SERVICE_INFO_PLIST                     Firebase, for push

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect (otherwise build only)
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Newest Xcode on the image
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "::error::no Xcode 26 on this image"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          IOS_DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          IOS_DIST_P12_PASS: ${{ secrets.IOS_DIST_P12_PASS }}
          IOS_PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
          IOS_NSE_PROFILE_B64: ${{ secrets.IOS_NSE_PROFILE_B64 }}
        run: |
          D="$RUNNER_TEMP/apple"; mkdir -p "$D"; chmod 700 "$D"
          echo "$ASC_KEY_P8_B64" | base64 --decode > "$D/AuthKey_${ASC_KEY_ID}.p8"
          openssl rand -hex 24 > "$D/ios-keychain.pw"
          PW=$(cat "$D/ios-keychain.pw")
          security create-keychain -p "$PW" discern-build.keychain
          security set-keychain-settings -lut 3600 discern-build.keychain
          security unlock-keychain -p "$PW" discern-build.keychain
          echo "$IOS_DIST_P12_B64" | base64 --decode > "$D/dist.p12"
          security import "$D/dist.p12" -k discern-build.keychain -P "$IOS_DIST_P12_PASS" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$D/dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PW" discern-build.keychain > /dev/null
          security list-keychains -d user -s discern-build.keychain $(security list-keychains -d user | tr -d '"')
          # Xcode 16 and later look here; older ones in MobileDevice
          for P in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$P"; echo "$IOS_PROFILE_B64" | base64 --decode > "$P/discern-app-store.mobileprovision"
            # the notification service extension has a profile of its own
            if [ -n "$IOS_NSE_PROFILE_B64" ]; then echo "$IOS_NSE_PROFILE_B64" | base64 --decode > "$P/discern-nse-app-store.mobileprovision"; fi
          done
          # tools/ios-nse.rb edits the Xcode project with this
          gem list -i xcodeproj >/dev/null || sudo gem install xcodeproj --no-document
          security find-identity -v -p codesigning | grep -c "Apple Distribution"

      - name: Swift packages (GitHub sometimes resets the large ones)
        run: |
          # cap add ends on a CocoaPods step this SPM project does not use; the
          # project it made is complete, as tools/ios-release.sh also assumes
          [ -d ios ] || PATH="$PWD/tools/.podless:$PATH" npx cap add ios --packagemanager SPM || true
          [ -f ios/App/App.xcodeproj/project.pbxproj ] || { echo "::error::no iOS project"; exit 1; }
          npx cap sync ios
          for i in 1 2 3 4; do
            xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App -scmProvider system && exit 0
            echo "::warning::package fetch failed (try $i), again in 20s"; sleep 20
          done
          exit 1

      - name: Build, sign and upload
        env:
          XURFACE_SECRETS: ${{ runner.temp }}/apple
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload }}" != "true" ]; then
            bash tools/ios-release.sh --build
          else
            bash tools/ios-release.sh
          fi

      - name: Archive log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-log
          path: ios/build/*.log
          if-no-files-found: ignore

      - name: Clean up the keychain
        if: always()
        run: security delete-keychain discern-build.keychain 2>/dev/null || true

name: Play status

# Read only. Reports what Play currently holds for the app: the release on each
# track, and which Google Groups are registered as testers. Changes nothing.
#
# Useful because the Console and the repository can drift, and because the API
# is the only place that says what actually landed.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet google-api-python-client google-auth pillow
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_SA }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Ask Play what it has
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 play/publish.py --status
